name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t focus-dial-api .
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 3000:3000 focus-dial-api
          for i in $(seq 1 20); do curl -fs localhost:3000/health && exit 0; sleep 1; done
          docker logs api
          exit 1
